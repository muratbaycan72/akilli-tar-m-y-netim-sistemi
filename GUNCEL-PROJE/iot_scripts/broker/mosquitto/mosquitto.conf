# Mosquitto MQTT Broker Yapılandırması

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ACL dosyası (ileride kimlik doğrulama eklendiğinde aktif edilecek)
# acl_file /mosquitto/config/acl.conf

# Bağlantı ayarları
max_connections -1
max_keepalive 65535

# Mesaj boyutu limiti (byte)
message_size_limit 1048576

# Topic yapısı:
# akilli-tarim/{field_id}/sensors/{sensor_type}
# akilli-tarim/{field_id}/commands/{action}
