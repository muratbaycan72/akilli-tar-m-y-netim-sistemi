model:
  name: soil_moisture_regressor
  version: "1.0.0"
  type: linear_regression

features:
  - temperature
  - humidity
  - rainfall_mm
  - wind_speed
  - solar_radiation

target: soil_moisture

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.01
  validation_split: 0.2
  random_seed: 42

data:
  synthetic_samples: 2000
  test_size: 0.2
  use_database: false

paths:
  saved_model_dir: saved_models/soil_moisture_v1

evaluation:
  metrics:
    - mae
    - rmse
    - r2
